services:
  plate-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: plate_ocr_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
